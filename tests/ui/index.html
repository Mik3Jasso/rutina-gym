<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas de pantalla</title>
<style>
  :root{color-scheme:dark;--bg:#0b0d10;--surface:#14181d;--borde:#252c35;--texto:#e9edf2;--muted:#8b97a6;--ok:#3ddc84;--mal:#ff4d4d}
  body{margin:0;padding:24px 16px;background:var(--bg);color:var(--texto);font:15px/1.5 Inter,system-ui,sans-serif}
  main{max-width:760px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  #resumen{color:var(--muted);margin:0 0 18px}
  #resumen.ok{color:var(--ok)} #resumen.mal{color:var(--mal)}
  ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--borde);border-radius:12px}
  li{padding:10px 14px;border-top:1px solid var(--borde);display:flex;gap:10px}
  li:first-child{border-top:none}
  li b{flex:none;width:18px} .ok b{color:var(--ok)} .mal b{color:var(--mal)}
  li small{display:block;color:var(--mal)}
  .suite{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;flex:none;width:86px}
  iframe{width:390px;height:700px;border:1px solid var(--borde);border-radius:12px;margin:18px 12px 0 0}
</style>
</head>
<body>
<main>
  <h1>Pruebas de pantalla</h1>
  <p id="resumen">Corriendo…</p>
  <ul id="lista"></ul>
  <div id="marcos"></div>
</main>
<script>
// Abre la app en un marco por cada suite, con datos inventados, una
// tras otra (comparten el almacenamiento del navegador), y junta lo que
// reporta cada una. window.__resumen queda listo al terminar.
const suites = ['alumno', 'entrenador'];
const todos = [];
let actual = 0;

function correr(i) {
  const f = document.createElement('iframe');
  f.src = `app.html?suite=${suites[i]}&t=${Date.now()}`;
  f.title = `Suite ${suites[i]}`;
  document.getElementById('marcos').appendChild(f);
}

window.addEventListener('message', (e) => {
  if (e.data?.tipo !== 'resultados') return;
  todos.push(...e.data.resultados);
  if (++actual < suites.length) { correr(actual); return; }
  const fallas = todos.filter((r) => !r.ok);
  document.getElementById('lista').innerHTML = todos.map((r) => `
    <li class="${r.ok ? 'ok' : 'mal'}"><b>${r.ok ? '✓' : '✗'}</b>
      <span class="suite">${r.suite}</span>
      <span>${r.nombre.replace(/</g, '&lt;')}${r.ok ? '' : `<small>${r.error.replace(/</g, '&lt;')}</small>`}</span></li>`).join('');
  const res = document.getElementById('resumen');
  res.textContent = fallas.length
    ? `${fallas.length} de ${todos.length} fallaron`
    : `Las ${todos.length} pasaron`;
  res.className = fallas.length ? 'mal' : 'ok';
  window.__resumen = { total: todos.length, fallas };
});

correr(0);
</script>
</body>
</html>
